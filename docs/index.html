<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entra App Cleanup</title>
<meta name="description" content="Sign in with your M365 admin account and clean up Entra ID app registrations: last sign-in, owners, active secrets. 100% client-side, read-only.">
<style>
/* Same Fluent look as Agent Governance Assessment: app bar, left navigation, cards, tables with pills, detail flyout. Light and dark themes. */
:root{
  --bg:#f5f5f5; --surface:#ffffff; --surface-2:#fafafa; --stroke:#e0e0e0; --stroke-2:#d1d1d1;
  --text:#242424; --text-2:#616161; --text-3:#8a8a8a;
  --brand:#0f6cbd; --brand-hover:#115ea3; --brand-bg:#ebf3fc; --appbar:#1b1a19; --appbar-text:#ffffff;
  --pass:#107c10; --pass-bg:#dff6dd; --fail:#c50f1f; --fail-bg:#fde7e9; --inv:#8a5300; --inv-bg:#fff4ce;
  --part:#8a3707; --part-bg:#fdebd8; --na:#616161; --na-bg:#f0f0f0;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SFMono-Regular",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 0 2px rgba(0,0,0,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#1a1a1a; --surface:#262626; --surface-2:#2c2c2c; --stroke:#3a3a3a; --stroke-2:#4a4a4a;
  --text:#f2f2f2; --text-2:#c2c2c2; --text-3:#8f8f8f;
  --brand:#479ef5; --brand-hover:#62abf5; --brand-bg:#082338; --appbar:#0d0d0d;
  --pass:#54b054; --pass-bg:#0e2e0e; --fail:#f1707b; --fail-bg:#3b1013; --inv:#f2c661; --inv-bg:#3a2d05;
  --part:#f4a266; --part-bg:#3a1e08; --na:#adadad; --na-bg:#333;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#1a1a1a; --surface:#262626; --surface-2:#2c2c2c; --stroke:#3a3a3a; --stroke-2:#4a4a4a;
  --text:#f2f2f2; --text-2:#c2c2c2; --text-3:#8f8f8f;
  --brand:#479ef5; --brand-hover:#62abf5; --brand-bg:#082338; --appbar:#0d0d0d;
  --pass:#54b054; --pass-bg:#0e2e0e; --fail:#f1707b; --fail-bg:#3b1013; --inv:#f2c661; --inv-bg:#3a2d05;
  --part:#f4a266; --part-bg:#3a1e08; --na:#adadad; --na-bg:#333;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
a{color:var(--brand)}

/* App bar */
.appbar{height:48px;background:var(--appbar);color:var(--appbar-text);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:20}
.appbar .logo{width:22px;height:22px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.appbar .logo i{display:block;border-radius:2px}
.appbar .name{font-weight:600;font-size:15px;white-space:nowrap}
.appbar .name .short{display:none}
.appbar .ed{font-size:12px;opacity:.7;white-space:nowrap}
.appbar .sp{flex:1}
.appbar .tenant{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36vw}
.iconbtn{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:4px;height:30px;padding:0 10px;cursor:pointer;font-size:13px}
.iconbtn:hover{background:rgba(255,255,255,.1)}
.iconbtn[hidden]{display:none}
.langsw{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
.langsw button{background:transparent;border:none;color:#fff;font-size:12px;font-weight:600;padding:0 9px;height:28px;cursor:pointer;opacity:.7}
.langsw button[aria-pressed="true"]{background:rgba(255,255,255,.18);opacity:1}

.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100% - 48px)}
nav.side{background:var(--surface);border-right:1px solid var(--stroke);padding:12px 8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:48px;height:calc(100vh - 48px)}
nav.side a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:4px;color:var(--text);text-decoration:none;font-weight:500}
nav.side a:hover{background:var(--surface-2)}
nav.side a[aria-current="page"]{background:var(--brand-bg);color:var(--brand);position:relative}
nav.side a[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--brand)}
nav.side a.off{opacity:.45;pointer-events:none}
nav.side .grp{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding:14px 12px 4px;font-weight:600}
nav.side svg{width:16px;height:16px;flex:none}
nav.side .badge{margin-left:auto;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;background:var(--fail-bg);color:var(--fail)}
main{padding:24px 28px 64px;min-width:0}
.view{display:none;flex-direction:column;gap:20px;width:100%;max-width:2400px}
.view.on{display:flex}
.ph h1{font-size:24px}
.ph p{margin:4px 0 0;color:var(--text-2);max-width:90ch}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:6px;background:var(--inv-bg);color:var(--text);border:1px solid color-mix(in srgb,var(--inv) 35%,transparent);font-size:13px;margin-bottom:16px}
.banner.err{background:var(--fail-bg);border-color:color-mix(in srgb,var(--fail) 35%,transparent)}
.banner.info{background:var(--brand-bg);border-color:color-mix(in srgb,var(--brand) 35%,transparent)}
.banner[hidden]{display:none}

.card{background:var(--surface);border:1px solid var(--stroke);border-radius:8px;box-shadow:var(--shadow);padding:16px}
.card h2{font-size:16px;margin-bottom:2px}
.card .sub{color:var(--text-2);font-size:13px;margin:0 0 12px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(5,1fr)}
.kpi{cursor:pointer;border-top:3px solid var(--c,var(--stroke))}
.kpi:hover{background:var(--surface-2)}
.kpi .lbl{color:var(--text-2);font-size:13px;font-weight:600}
.kpi .v{font-family:var(--font-display);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:6px}
.kpi .v small{font-size:15px;color:var(--text-2);font-weight:400}
.kpi .foot{font-size:12px;color:var(--text-2);margin-top:6px}
.halves{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--stroke);margin:6px 0 10px}
.stack span{display:block;height:100%;background:var(--c)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend button{all:unset;display:flex;gap:8px;align-items:center;cursor:pointer;padding:3px 4px;border-radius:4px}
.legend button:hover{background:var(--surface-2)}
.legend button:focus-visible{outline:2px solid var(--brand)}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pass{background:var(--pass-bg);color:var(--pass)} .st-fail{background:var(--fail-bg);color:var(--fail)}
.st-inv{background:var(--inv-bg);color:var(--inv)} .st-part{background:var(--part-bg);color:var(--part)}
.st-na{background:var(--na-bg);color:var(--na)}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:0 6px;border:1px solid var(--stroke-2);color:var(--text-2);white-space:nowrap}
.tag.bad{border-color:color-mix(in srgb,var(--fail) 50%,transparent);color:var(--fail);background:var(--fail-bg)}
.tag.warn{border-color:color-mix(in srgb,var(--inv) 50%,transparent);color:var(--inv);background:var(--inv-bg)}
.tag.ok{border-color:color-mix(in srgb,var(--pass) 50%,transparent);color:var(--pass);background:var(--pass-bg)}
.muted{color:var(--text-2)}
.small{font-size:12px}

/* tables */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.tbl{font-size:13.5px}
.tbl th{text-align:left;color:var(--text-2);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--stroke-2);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.tbl th button{all:unset;cursor:pointer}
.tbl th button:focus-visible{outline:2px solid var(--brand)}
.tbl th .ar{font-size:10px;margin-left:4px;color:var(--brand)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--stroke);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .t{font-weight:500}
.tbl .id{font-family:var(--mono);font-size:12px;color:var(--text-2)}
.tbl .meta{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.tbl td.num{font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 260px;min-width:200px;height:32px;border:1px solid var(--stroke-2);border-bottom-color:var(--text-2);border-radius:4px;background:var(--surface);padding:0 10px}
.sel{height:32px;border:1px solid var(--stroke-2);border-radius:4px;background:var(--surface);padding:0 8px;min-width:120px}
.btn{height:32px;border:1px solid var(--stroke-2);border-radius:4px;background:var(--surface);padding:0 12px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hover)}
[hidden]{display:none !important}
.btn:disabled{opacity:.5;cursor:default}
.count{color:var(--text-2);font-size:13px;margin-left:auto}
.empty-st{padding:28px;text-align:center;color:var(--text-2)}
.more{display:flex;justify-content:center;padding:12px}

/* connect */
.connect{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--text-2)}
.field input{border:1px solid var(--stroke-2);border-bottom-color:var(--text-2);border-radius:4px;background:var(--surface);padding:6px 8px;height:32px}
.field small{color:var(--text-3);font-size:12px}
.copyrow{display:flex;gap:6px}
.copyrow code{flex:1;font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--stroke);border-radius:4px;padding:6px 8px;overflow:auto;white-space:nowrap}
.actions-row{display:flex;gap:8px;flex-wrap:wrap}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ol.steps code,.prose code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--stroke);border-radius:4px;padding:0 4px}
.prose{max-width:85ch}
.prose pre{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--stroke);border-radius:4px;padding:10px 12px;overflow-x:auto}

/* progress */
.progress{display:flex;flex-direction:column;gap:10px}
.progress .row{display:flex;gap:10px;align-items:center;font-size:13px}
.progress .row .s{width:18px;text-align:center;font-weight:700}
.progress .row.done .s{color:var(--pass)} .progress .row.err .s{color:var(--fail)} .progress .row.warn .s{color:var(--inv)}
.progress .row .c{margin-left:auto;color:var(--text-2);font-variant-numeric:tabular-nums}
.spin{width:14px;height:14px;border:2px solid var(--stroke-2);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* flyout */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none}
.scrim.on{display:block}
aside.fly{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);z-index:31;box-shadow:-8px 0 24px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;visibility:hidden}
aside.fly.on{transform:none;visibility:visible}
.fly header{padding:16px 20px;border-bottom:1px solid var(--stroke);display:flex;gap:12px;align-items:flex-start}
.fly header h2{font-size:18px;word-break:break-word}
.fly header .sp{flex:1}
.fly .body{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.fly h3{font-size:13px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.facts div{background:var(--surface-2);border:1px solid var(--stroke);border-radius:6px;padding:8px;min-width:0;overflow-wrap:anywhere}
.facts b{display:block;font-size:11px;color:var(--text-2);font-weight:600}
.mini{font-size:13px}
.mini td,.mini th{padding:6px 8px;border-bottom:1px solid var(--stroke);text-align:left}
.mini th{color:var(--text-2);font-weight:600;font-size:12px}
ul.todo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.todo li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--stroke);border-radius:6px;background:var(--surface-2);font-size:13px}
ul.todo li i{font-style:normal;font-weight:700;width:16px;flex:none}
ul.todo li.bad i{color:var(--fail)} ul.todo li.warn i{color:var(--inv)} ul.todo li.ok i{color:var(--pass)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;place-items:center;padding:16px}
.modal.on{display:grid}
.modal .box{background:var(--surface);border-radius:8px;padding:20px;width:min(760px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.modal textarea{min-height:320px;font-family:var(--mono);font-size:12px;border:1px solid var(--stroke-2);border-radius:4px;background:var(--surface-2);padding:10px;resize:vertical}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:8px 16px;border-radius:6px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
footer.f{color:var(--text-3);font-size:12px;margin-top:8px}

@media (max-width:1200px){ .kpis{grid-template-columns:repeat(3,1fr)} .halves{grid-template-columns:1fr 1fr} .connect{grid-template-columns:1fr} }
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav.side{position:sticky;top:48px;height:auto;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--stroke);padding:6px;z-index:10}
  nav.side .grp{display:none}
  nav.side a{white-space:nowrap;padding:6px 10px}
  nav.side a[aria-current="page"]::before{display:none}
  main{padding:16px 16px 48px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .halves{grid-template-columns:1fr}
  .appbar .ed,.appbar .tenant{display:none}
  .facts{grid-template-columns:repeat(2,1fr)}
  .hide-sm{display:none}
}
@media (max-width:640px){
  .appbar{gap:8px;padding:0 10px}
  .appbar .name .full{display:none}
  .appbar .name .short{display:inline}
  .toolbar .search{flex:1 1 100%}
  .toolbar .sel{flex:1 1 45%;min-width:0}
  .count{margin-left:0;width:100%}
}
@media (min-width:2000px){ html{zoom:1.12} }
</style>
</head>
<body>

<header class="appbar">
  <span class="logo" aria-hidden="true"><i style="background:#f25022"></i><i style="background:#7fba00"></i><i style="background:#00a4ef"></i><i style="background:#ffb900"></i></span>
  <span class="name"><span class="full">Entra App Cleanup</span><span class="short">EAC</span></span>
  <span class="ed" data-i18n="edition"></span>
  <span class="sp"></span>
  <span class="tenant" id="tenantLbl"></span>
  <span class="langsw" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button></span>
  <button class="iconbtn" id="themeBtn" type="button" data-i18n="theme"></button>
  <button class="iconbtn" id="outBtn" type="button" data-i18n="signOut" hidden></button>
</header>

<div class="shell">
<nav class="side" aria-label="Sections">
  <div class="grp" data-i18n="grpReport"></div>
  <a href="#overview" data-v="overview" class="needdata"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 2h5v5H2zM9 2h5v3H9zM9 7h5v7H9zM2 9h5v5H2z"/></svg><span data-i18n="navOverview"></span></a>
  <a href="#apps" data-v="apps" class="needdata"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 3h2v2H2zm4 0h8v2H6zM2 7h2v2H2zm4 0h8v2H6zm-4 4h2v2H2zm4 0h8v2H6z"/></svg><span data-i18n="navApps"></span></a>
  <a href="#cleanup" data-v="cleanup" class="needdata"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6 1h4v1.5h4V4H2V2.5h4zM3 5h10l-.8 10H3.8zm3 2v6h1.2V7zm2.8 0v6H10V7z"/></svg><span data-i18n="navCleanup"></span><span class="badge" id="cleanBadge" hidden></span></a>
  <div class="grp" data-i18n="grpSetup"></div>
  <a href="#connect" data-v="connect"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1a3.5 3.5 0 0 1 3.5 3.5V6H13v9H3V6h1.5V4.5A3.5 3.5 0 0 1 8 1zm0 1.5a2 2 0 0 0-2 2V6h4V4.5a2 2 0 0 0-2-2zM7.25 9v3h1.5V9z"/></svg><span data-i18n="navConnect"></span></a>
  <a href="#about" data-v="about"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm-.75 3h1.5v1.5h-1.5zm0 3h1.5v5h-1.5z"/></svg><span data-i18n="navAbout"></span></a>
</nav>

<main>
<div class="banner" id="banner" hidden><span id="bannerText"></span><span id="bannerAct"></span></div>

<!-- CONNECT -->
<section class="view" id="v-connect">
  <div class="ph"><h1 data-i18n="cnTitle"></h1><p data-i18n="cnIntro"></p></div>
  <div class="grid connect">
    <div class="card">
      <h2 data-i18n="cnSignin"></h2>
      <p class="sub" data-i18n="cnSigninSub"></p>
      <div class="field"><label for="fTenant" data-i18n="fTenant"></label><input id="fTenant" placeholder="contoso.onmicrosoft.com" autocomplete="off" spellcheck="false"><small data-i18n="fTenantHelp"></small></div>
      <div class="field"><label for="fClient" data-i18n="fClient"></label><input id="fClient" placeholder="00000000-0000-0000-0000-000000000000" autocomplete="off" spellcheck="false"><small data-i18n="fClientHelp"></small></div>
      <div class="field"><label data-i18n="fRedirect"></label><div class="copyrow"><code id="redirUri"></code><button class="btn" type="button" id="copyRedir" data-i18n="copy"></button></div><small data-i18n="fRedirectHelp"></small></div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label for="fInactive" data-i18n="fInactive"></label><input id="fInactive" type="number" min="7" max="730" value="90"></div>
        <div class="field"><label for="fSoon" data-i18n="fSoon"></label><input id="fSoon" type="number" min="1" max="365" value="30"></div>
      </div>
      <div class="actions-row">
        <button class="btn primary" type="button" id="signInBtn" data-i18n="signIn"></button>
        <button class="btn" type="button" id="reloadBtn" data-i18n="reload" hidden></button>
        <button class="btn" type="button" id="demoBtn" data-i18n="demo"></button>
      </div>
      <div class="progress" id="progress" style="margin-top:16px" hidden></div>
    </div>
    <div class="card">
      <h2 data-i18n="cnSetup"></h2>
      <p class="sub" data-i18n="cnSetupSub"></p>
      <ol class="steps" id="setupSteps"></ol>
    </div>
  </div>
</section>

<!-- OVERVIEW -->
<section class="view" id="v-overview">
  <div class="ph"><h1 data-i18n="navOverview"></h1><p id="ovIntro"></p></div>
  <div class="grid kpis" id="kpis"></div>
  <div class="grid halves" id="dists"></div>
  <div class="card">
    <h2 data-i18n="topTitle"></h2><p class="sub" data-i18n="topSub"></p>
    <div class="scroll"><table class="tbl" id="topTbl"></table></div>
  </div>

/* ---------------- auth (PKCE, redirect flow) ---------------- */
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
function jwtPayload(jwt){
  try{ const p = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"); return JSON.parse(decodeURIComponent(escape(atob(p + "===".slice((p.length + 3) % 4))))); }catch{ return {}; }
}
async function signIn(){
  readCfg();
  if(!S.cfg.tenant || !S.cfg.clientId){ banner(t("needCfg"), "err"); return; }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  SS.set("pkce", {verifier, state, tenant:S.cfg.tenant, clientId:S.cfg.clientId});
  const p = new URLSearchParams({client_id:S.cfg.clientId, response_type:"code", redirect_uri:REDIRECT, response_mode:"query",
    scope:SCOPES, state, code_challenge:challenge, code_challenge_method:"S256", prompt:"select_account"});
  location.href = `https://login.microsoftonline.com/${encodeURIComponent(S.cfg.tenant)}/oauth2/v2.0/authorize?${p}`;
}
async function handleRedirect(){
  const q = new URLSearchParams(location.search);
  if(!q.has("code") && !q.has("error")) return false;
  const saved = SS.get("pkce"); SS.del("pkce");
  history.replaceState(null, "", REDIRECT + location.hash);
  if(q.has("error")) throw new Error(q.get("error_description") || q.get("error"));
  if(!saved || saved.state !== q.get("state")) throw new Error("state mismatch");
  const body = new URLSearchParams({client_id:saved.clientId, grant_type:"authorization_code", code:q.get("code"),
    redirect_uri:REDIRECT, code_verifier:saved.verifier, scope:SCOPES});
  const r = await fetch(`https://login.microsoftonline.com/${encodeURIComponent(saved.tenant)}/oauth2/v2.0/token`,
    {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body});
  const j = await r.json();
  if(!r.ok) throw new Error(j.error_description || j.error || r.status);
  const id = jwtPayload(j.id_token || "");
  SS.set("tok", {at:j.access_token, rt:j.refresh_token || null, exp:Date.now() + (j.expires_in - 60) * 1000,
    tenant:saved.tenant, clientId:saved.clientId, user:id.preferred_username || id.name || "", tid:id.tid || ""});
  return true;
}
async function token(){
  const tk = SS.get("tok"); if(!tk) return null;
  if(Date.now() < tk.exp) return tk.at;
  if(tk.rt){ // SPA refresh tokens are allowed (24 h) and must be redeemed from the same origin
    const body = new URLSearchParams({client_id:tk.clientId, grant_type:"refresh_token", refresh_token:tk.rt, scope:SCOPES});
    const r = await fetch(`https://login.microsoftonline.com/${encodeURIComponent(tk.tenant)}/oauth2/v2.0/token`,
      {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body});
    if(r.ok){ const j = await r.json(); Object.assign(tk, {at:j.access_token, rt:j.refresh_token || tk.rt, exp:Date.now() + (j.expires_in - 60) * 1000}); SS.set("tok", tk); return tk.at; }
  }
  SS.del("tok"); return null;
}
function signOut(){
  const tk = SS.get("tok"); SS.del("tok"); S.raw = null; S.apps = [];
  if(tk){ location.href = `https://login.microsoftonline.com/${encodeURIComponent(tk.tenant)}/oauth2/v2.0/logout?post_logout_redirect_uri=${encodeURIComponent(REDIRECT)}`; }
  else { renderAll(); go("connect"); }
}

/* ---------------- Graph ---------------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function g(url){
  for(let i = 0; i < 6; i++){
    const at = await token();
    if(!at){ const e = new Error("expired"); e.expired = true; throw e; }
    const r = await fetch(url.startsWith("http") ? url : GRAPH + url, {headers:{Authorization:"Bearer " + at}});
    if(r.status === 429 || r.status === 503 || r.status === 504){ const ra = +r.headers.get("Retry-After"); await sleep((ra || 2 ** i) * 1000); continue; }
    const j = await r.json().catch(() => ({}));
    if(!r.ok){ const e = new Error(j.error?.message || ("HTTP " + r.status)); e.status = r.status; e.code = j.error?.code; throw e; }
    return j;
  }
  throw new Error("throttled");
}
async function gAll(url, onPage){
  let out = [];
  while(url){ const j = await g(url); out = out.concat(j.value || []); onPage && onPage(out.length); url = j["@odata.nextLink"]; }
  return out;
}

/* ---------------- evaluation ---------------- */
function evaluate(){
  const R = S.raw; if(!R){ S.apps = []; return; }
  const inact = +S.cfg.inactive || 90, soon = +S.cfg.soon || 30, now = Date.now();
  const sMap = new Map(); R.signins.forEach(s => s.appId && sMap.set(s.appId.toLowerCase(), s));
  const cMap = new Map();
  R.creds.forEach(c => { if(!c.keyId) return; const d = c.signInActivity?.lastSignInDateTime || null; const prev = cMap.get(c.keyId); if(prev === undefined || (d && (!prev || d > prev))) cMap.set(c.keyId, d); });
  const maxD = arr => arr.filter(Boolean).sort().pop() || null;

  S.apps = R.apps.map(a => {
    const s = sMap.get((a.appId || "").toLowerCase());
    const acts = s ? {
      any: s.lastSignInActivity?.lastSignInDateTime,
      delClient: s.delegatedClientSignInActivity?.lastSignInDateTime,
      delRes: s.delegatedResourceSignInActivity?.lastSignInDateTime,
      appClient: s.applicationAuthenticationClientSignInActivity?.lastSignInDateTime,
      appRes: s.applicationAuthenticationResourceSignInActivity?.lastSignInDateTime } : {};
    const last = maxD(Object.values(acts));
    const age = daysSince(a.createdDateTime) ?? 9999;
    const recent = age < inact;

    const creds = [
      ...(a.passwordCredentials || []).map(c => ({type:"secret", keyId:c.keyId, name:c.displayName || (c.hint ? c.hint + "…" : ""), start:c.startDateTime, end:c.endDateTime})),
      ...(a.keyCredentials || []).map(c => ({type:"cert", keyId:c.keyId, name:c.displayName || c.customKeyIdentifier || "", start:c.startDateTime, end:c.endDateTime, usage:c.usage}))
    ].map(c => {
      const left = c.end ? (new Date(c.end).getTime() - now) / DAY : -1;
      c.status = left < 0 ? "expired" : left <= soon ? "soon" : "active";
      c.lastUsed = R.credOk ? (cMap.get(c.keyId) ?? null) : undefined;
      c.long = c.type === "secret" && c.start && c.end && (new Date(c.end) - new Date(c.start)) / DAY > 732;
      return c;
    });
    const valid = creds.filter(c => c.status !== "expired");
    const validSecrets = valid.filter(c => c.type === "secret").length;
    const validCerts = valid.filter(c => c.type === "cert").length;
    const expired = creds.filter(c => c.status === "expired").length;

    const owners = (a.owners || []).map(o => ({name:o.displayName || o.userPrincipalName || o.id, upn:o.userPrincipalName || "",
      isSp:(o["@odata.type"] || "").includes("servicePrincipal"), disabled:o.accountEnabled === false}));
    const ownerState = owners.length === 0 ? "none" : owners.every(o => o.disabled) ? "disabled" : "ok";

    let sign = !R.signOk ? "unknown" : !last ? "never" : daysSince(last) > inact ? "stale" : "active";
    const unused = sign === "never" || sign === "stale";
    const credState = validSecrets ? "active" : validCerts ? "cert" : expired ? "expired" : "none";

    const flags = [];
    if(unused && valid.length) flags.push("risk");
    if(ownerState === "none") flags.push("noOwner");
    if(ownerState === "disabled") flags.push("disOwner");
    if(expired) flags.push("expired");
    if(sign === "active" && R.credOk && valid.some(c => !c.lastUsed && daysSince(c.start) > inact)) flags.push("unusedCred");
    if(valid.some(c => c.status === "soon")) flags.push("soon");
    if(valid.some(c => c.long)) flags.push("long");

    let verdict;
    if(sign === "unknown") verdict = "unknown";
    else if(unused && !recent) verdict = "delete";
    else if(flags.some(f => ["noOwner", "disOwner", "expired", "unusedCred", "soon", "long", "risk"].includes(f))) verdict = "review";
    else verdict = "ok";

    // priority: lower is more urgent
    const prio = (verdict === "delete" ? (flags.includes("risk") ? 0 : 1) : verdict === "review" ? (flags.includes("risk") ? 2 : 3) : verdict === "unknown" ? 4 : 5) * 1e6 - (daysSince(last) ?? age);
    const signShown = unused && recent && sign === "never" ? "recent" : sign;

    return {id:a.id, appId:a.appId, name:a.displayName || "(no name)", created:a.createdDateTime, age, audience:a.signInAudience || "", publisher:a.publisherDomain || "",
      acts, last, sign, signShown, recent, owners, ownerState, creds, validSecrets, validCerts, expired, credState, flags, verdict, prio};
  });
}

  const cols = [["prio", "cVerdict"], ["name", "cName"], ["last", "cLast"], ["owners", "cOwners"], ["creds", "cCreds"], ["created", "cCreated"]];
  const head = `<thead><tr>${cols.map(([k, l]) => `<th class="${k === "created" ? "hide-sm" : ""}"><button type="button" data-k="${k}">${esc(t(l))}${S.sort.k === k ? `<span class="ar">${S.sort.d > 0 ? "▲" : "▼"}</span>` : ""}</button></th>`).join("")}</tr></thead>`;
  const rows = L.slice(0, S.shown).map(a => `<tr data-id="${a.id}"><td>${vPill(a)}</td><td><div class="t">${esc(a.name)}</div><div class="id">${esc(a.appId)}</div><div class="meta">${flagsHtml(a)}</div></td><td>${signCell(a)}</td><td>${ownersCell(a)}</td><td>${credCell(a)}</td><td class="hide-sm muted">${esc(fmtDate(a.created))}</td></tr>`).join("");
  $("#appTbl").innerHTML = head + `<tbody>${rows || `<tr><td colspan="6" class="empty-st">${esc(t("clEmpty"))}</td></tr>`}</tbody>`;
  $("#count").textContent = t("showing", Math.min(S.shown, L.length), L.length);
  const rest = L.length - S.shown;
  $("#moreWrap").hidden = rest <= 0; $("#moreBtn").textContent = t("showMore", Math.min(rest, 200));
  $$("#appTbl th button").forEach(b => b.onclick = () => { const k = b.dataset.k; S.sort = {k, d:S.sort.k === k ? -S.sort.d : (k === "last" || k === "created" ? 1 : 1)}; renderApps(); });
  $$("#appTbl tbody tr[data-id]").forEach(r => r.onclick = () => openFly(r.dataset.id));
}
$("#moreBtn").onclick = () => { S.shown += 200; renderApps(); };
$("#q").oninput = e => { S.f.q = e.target.value; S.shown = 100; renderApps(); };
$("#fVerdict").onchange = e => { S.f.verdict = e.target.value; renderApps(); };
$("#fSign").onchange = e => { S.f.sign = e.target.value; renderApps(); };
$("#fOwner").onchange = e => { S.f.owner = e.target.value; renderApps(); };
$("#fCred").onchange = e => { const v = e.target.value; S.f.flag = v === "risk" ? "risk" : ""; S.f.cred = v === "risk" ? "" : v; renderApps(); };
$("#resetF").onclick = () => openApps({});

/* ---------------- flyout ---------------- */
function openFly(id){
  const a = S.apps.find(x => x.id === id); if(!a) return;
  $("#flyTitle").textContent = a.name; $("#flySub").textContent = a.appId;
  const inact = S.cfg.inactive;
  const todo = [];
  if(a.verdict === "unknown") todo.push(["warn", t("todoUnknown")]);
  if(a.flags.includes("risk")) todo.push(["bad", t("todoRisk")]);
  if(a.verdict === "delete") todo.push(["bad", t("todoDelete", inact)]);
  if(a.signShown === "recent") todo.push(["warn", t("todoRecent", inact)]);
  if(a.verdict !== "delete"){
    if(a.ownerState === "none") todo.push(["bad", t("todoNoOwner")]);
    if(a.ownerState === "disabled") todo.push(["warn", t("todoDisOwner")]);
    if(a.flags.includes("unusedCred")) todo.push(["warn", t("todoUnused")]);
    if(a.flags.includes("soon")) todo.push(["warn", t("todoSoon")]);
    if(a.flags.includes("long")) todo.push(["warn", t("todoLong")]);
  }
  if(a.flags.includes("expired")) todo.push(["warn", t("todoExpired")]);
  if(!todo.length) todo.push(["ok", t("todoOk")]);

  const acts = [["sAny", a.acts.any], ["sDelClient", a.acts.delClient], ["sDelRes", a.acts.delRes], ["sAppClient", a.acts.appClient], ["sAppRes", a.acts.appRes]];
  const credRows = a.creds.sort((x, y) => (y.end || "").localeCompare(x.end || "")).map(c => `<tr><td>${esc(t(c.type))}</td><td>${esc(c.name || "—")}</td><td>${esc(fmtDate(c.end))}</td><td>${c.lastUsed === undefined ? "—" : esc(c.lastUsed ? agoTxt(c.lastUsed) : t("never"))}</td><td>${pill(c.status === "expired" ? "st-na" : c.status === "soon" ? "st-inv" : (a.sign === "never" || a.sign === "stale") ? "st-fail" : "st-pass", t("cr_" + c.status))}</td></tr>`).join("");
  const portal = `https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationMenuBlade/~/Overview/appId/${encodeURIComponent(a.appId)}`;

  $("#flyBody").innerHTML = `
    <div><h3>${esc(t("flyTodo"))}</h3><ul class="todo">${todo.map(([c, s]) => `<li class="${c}"><i>${c === "ok" ? "✓" : "!"}</i><span>${esc(s)}</span></li>`).join("")}</ul></div>
    <div><h3>${esc(t("flyFacts"))}</h3><div class="facts">
      <div><b>${esc(t("fVerdict"))}</b>${vPill(a)}</div>
      <div><b>${esc(t("fLastL"))}</b>${esc(a.sign === "unknown" ? "—" : agoTxt(a.last))}</div>
      <div><b>${esc(t("fCreatedL"))}</b>${esc(fmtDate(a.created))}</div>
      <div><b>${esc(t("fAudience"))}</b>${esc(a.audience)}</div>
      <div><b>${esc(t("fPublisher"))}</b>${esc(a.publisher || "—")}</div>
      <div><b>Object ID</b><span class="small" style="font-family:var(--mono)">${esc(a.id)}</span></div>
    </div><div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${flagsHtml(a)}</div></div>
    <div><h3>${esc(t("flySign"))}</h3>${S.raw.signOk ? `<table class="mini"><tbody>${acts.map(([l, d]) => `<tr><td>${esc(t(l))}</td><td>${esc(d ? fmtDate(d) : "—")}</td><td class="muted">${d ? esc(agoTxt(d)) : ""}</td></tr>`).join("")}</tbody></table>` : `<p class="muted">${esc(t("todoUnknown"))}</p>`}</div>
    <div><h3>${esc(t("flyOwners"))} (${a.owners.length})</h3>${a.owners.length ? `<table class="mini"><tbody>${a.owners.map(o => `<tr><td>${esc(o.name)}${o.isSp ? ` <span class="tag">${esc(t("sp"))}</span>` : ""}${o.disabled ? ` <span class="tag warn">${esc(t("disabled"))}</span>` : ""}</td><td class="muted">${esc(o.upn)}</td></tr>`).join("")}</tbody></table>` : `<span class="tag bad">${esc(t("o_none"))}</span>`}</div>
    <div><h3>${esc(t("flyCreds"))} (${a.creds.length})</h3>${a.creds.length ? `<div class="scroll"><table class="mini"><thead><tr><th>${esc(t("crType"))}</th><th>${esc(t("crName"))}</th><th>${esc(t("crEnd"))}</th><th>${esc(t("crUsed"))}</th><th>${esc(t("crStatus"))}</th></tr></thead><tbody>${credRows}</tbody></table></div>` : `<span class="muted">${esc(t("none"))}</span>`}</div>
    <div class="actions-row">${S.raw.demo ? "" : `<a class="btn primary" href="${portal}" target="_blank" rel="noopener">${esc(t("flyOpen"))} ↗</a>`}<button class="btn" type="button" id="flyCopy">${esc(t("copy"))} App ID</button></div>`;
  $("#flyCopy").onclick = () => copy(a.appId);
  $("#scrim").classList.add("on"); $("#fly").classList.add("on"); $("#flyClose").focus();
}
function closeFly(){ $("#scrim").classList.remove("on"); $("#fly").classList.remove("on"); }
$("#flyClose").onclick = closeFly; $("#scrim").onclick = closeFly;
document.addEventListener("keydown", e => { if(e.key === "Escape"){ closeFly(); closeModal(); } });

/* ---------------- cleanup ---------------- */
function renderCleanup(){
  if(!S.raw) return;
  const A = [...S.apps].sort((x, y) => x.prio - y.prio);
  const groups = [
    ["clA", "clASub", A.filter(a => a.flags.includes("risk")), {flag:"risk"}],
    ["clB", "clBSub", A.filter(a => a.verdict === "delete"), {verdict:"delete"}],
    ["clC", "clCSub", A.filter(a => a.verdict !== "delete" && a.ownerState !== "ok"), {owner:"noactive", verdict:""}],
    ["clD", "clDSub", A.filter(a => a.expired > 0), {flag:"expired"}]
  ];
  $("#clCards").innerHTML = groups.map(([h, s, L], i) => `<div class="card"><h2>${esc(t(h))} · ${L.length}</h2><p class="sub">${esc(t(s))}</p>
    ${L.length ? `<table class="mini"><tbody>${L.slice(0, 8).map(a => `<tr data-id="${a.id}" style="cursor:pointer"><td><div>${esc(a.name)}</div><div class="muted small">${esc(a.sign === "unknown" ? "" : agoTxt(a.last))}</div></td><td style="text-align:right">${credCell(a)}</td></tr>`).join("")}</tbody></table>
    ${L.length > 8 ? `<button class="btn" type="button" style="margin-top:8px" data-g="${i}">${esc(t("clMore", L.length - 8))}</button>` : ""}` : `<p class="muted">${esc(t("clEmpty"))}</p>`}</div>`).join("");
  $$("#clCards tr[data-id]").forEach(r => r.onclick = () => openFly(r.dataset.id));
  $$("#clCards button[data-g]").forEach(b => b.onclick = () => openApps(groups[+b.dataset.g][3]));
  const nDel = S.apps.filter(a => a.verdict === "delete").length;
  const badge = $("#cleanBadge"); badge.hidden = !nDel; badge.textContent = nDel;
}
function csvOf(L){
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["DisplayName", "AppId", "ObjectId", "Verdict", "Flags", "SignInState", "LastSignIn", "Created", "Owners", "OwnerState", "ValidSecrets", "ValidCertificates", "ExpiredCredentials", "NextExpiry"];
  const rows = L.map(a => [a.name, a.appId, a.id, a.verdict, a.flags.join("|"), a.sign, a.last || "", a.created || "", a.owners.map(o => o.upn || o.name).join("; "), a.ownerState, a.validSecrets, a.validCerts, a.expired,
    a.creds.filter(c => c.status !== "expired").map(c => c.end).sort()[0] || ""]);
  return "﻿" + [head, ...rows].map(r => r.map(q).join(";")).join("\r\n");
}
const stamp = () => new Date().toISOString().slice(0, 10);
$("#csvBtn").onclick = () => download(`entra-apps-${stamp()}.csv`, csvOf(filtered()), "text/csv");
$("#csvDelBtn").onclick = () => download(`entra-apps-to-delete-${stamp()}.csv`, csvOf(S.apps.filter(a => a.verdict === "delete").sort((x, y) => x.prio - y.prio)), "text/csv");

function buildScript(){
  const L = S.apps.filter(a => a.verdict === "delete").sort((x, y) => x.prio - y.prio);
  const fr = LANG === "fr";
  const lines = [
    "# Entra App Cleanup - " + (fr ? "script de nettoyage" : "cleanup script") + " - " + new Date().toISOString(),
    "# " + (fr ? `${L.length} app(s) candidates à la suppression (inactives depuis plus de ${S.cfg.inactive} jours).` : `${L.length} app(s) to delete (inactive for more than ${S.cfg.inactive} days).`),
    "# " + (fr ? "Les lignes Remove-MgApplication sont commentées : décommentez uniquement ce que le propriétaire a validé." : "Remove-MgApplication lines are commented out: uncomment only what the owner has validated."),
    "# " + (fr ? "Une app supprimée reste 30 jours dans la corbeille : Restore-MgDirectoryDeletedItem -DirectoryObjectId <ObjectId>" : "A deleted app stays 30 days in the recycle bin: Restore-MgDirectoryDeletedItem -DirectoryObjectId <ObjectId>"),
    "",
    "# " + (fr ? "Connexion avec le droit d'écriture sur les applications" : "Sign in with write access to applications"),
    "Connect-MgGraph -Scopes 'Application.ReadWrite.All' -NoWelcome",
    ""
  ];
  L.forEach(a => {
    lines.push(`# ${a.name} | ${a.appId} | ${fr ? "dernière connexion" : "last sign-in"}: ${a.last ? a.last.slice(0, 10) : (fr ? "jamais" : "never")} | ${fr ? "propriétaires" : "owners"}: ${a.owners.map(o => o.upn || o.name).join(", ") || (fr ? "aucun" : "none")} | ${fr ? "secrets valides" : "valid secrets"}: ${a.validSecrets}, ${fr ? "certificats valides" : "valid certs"}: ${a.validCerts}`);
    lines.push(`# Remove-MgApplication -ApplicationId '${a.id}'`);
    lines.push("");
  });
  return lines.join("\r\n");
}
$("#scriptBtn").onclick = () => {
  $("#modalTitle").textContent = t("scriptTitle"); $("#modalSub").textContent = t("scriptSub");
  $("#modalText").value = buildScript(); $("#modal").classList.add("on");
};
function closeModal(){ $("#modal").classList.remove("on"); }
$("#modalClose").onclick = closeModal;
$("#modalCopy").onclick = () => copy($("#modalText").value);
$("#modalDl").onclick = () => download(`entra-app-cleanup-${stamp()}.ps1`, $("#modalText").value);

/* ---------------- demo data ---------------- */
function demoData(){
  let seed = 42; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const iso = d => new Date(Date.now() - d * DAY).toISOString();
  const guid = () => "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.floor(rnd() * 16); return (c === "x" ? r : (r & 3) | 8).toString(16); });
  const people = [["Alex Martin", "alex.martin"], ["Camille Durand", "camille.durand"], ["Sam Patel", "sam.patel"], ["Léa Bernard", "lea.bernard"], ["Jordan Lee", "jordan.lee"], ["Nora Petit", "nora.petit"]];
  const names = ["HR Portal", "Power BI Embedded", "SAP Connector", "Legacy Intranet", "Ticketing Webhook", "POC Chatbot", "Backup Service", "Expense App", "SharePoint Migration Tool", "Teams Bot - Helpdesk", "Jenkins CI", "Terraform Pipeline", "Old CRM Sync", "Marketing Forms", "Copilot Plugin Test", "Azure DevOps Sync", "Badge Reader API", "Payroll Export", "Graph Explorer Test", "Intune Reporting", "Datadog Integration", "ServiceNow Connector", "Mailbox Audit Script", "Test App 1", "Test App 2", "Defender Automation", "Fabric Ingestion", "Logic Apps Connector", "Survey Tool", "Partner Portal", "Webinar Platform", "Archive Reader", "MFA Report", "Sentinel Playbook", "Signature Manager", "Room Booking", "Visitor Kiosk", "Cost Dashboard", "AI Lab Sandbox", "Wiki Sync"];
  const apps = [], signins = [], creds = [];
  names.forEach((n, i) => {
    const id = guid(), appId = guid(), age = 20 + Math.floor(rnd() * 1400);
    const kind = rnd();
    const last = kind < .15 ? null : kind < .35 ? 100 + Math.floor(rnd() * 500) : Math.floor(rnd() * 60);
    const nOwners = rnd() < .3 ? 0 : 1 + Math.floor(rnd() * 3);
    const owners = [...new Set(Array.from({length:nOwners}, () => pick(people)))].map(p => { return {"@odata.type":"#microsoft.graph.user", id:guid(), displayName:p[0], userPrincipalName:p[1] + "@contoso.com", accountEnabled:rnd() > .25}; });
    const pw = Array.from({length:Math.floor(rnd() * 3)}, () => { const st = Math.floor(rnd() * 900); const len = pick([180, 365, 730, 1095]); return {keyId:guid(), displayName:pick(["prod", "dev", "pipeline", "", "temp"]), hint:"Ab" + Math.floor(rnd() * 9), startDateTime:iso(st), endDateTime:iso(st - len)}; });
    const kc = rnd() < .2 ? [{keyId:guid(), displayName:"CN=" + n.replace(/\W/g, ""), startDateTime:iso(200), endDateTime:iso(200 - 730), usage:"Verify", type:"AsymmetricX509Cert"}] : [];
    apps.push({id, appId, displayName:n, createdDateTime:iso(age), signInAudience:rnd() < .15 ? "AzureADMultipleOrgs" : "AzureADMyOrg", publisherDomain:"contoso.com", passwordCredentials:pw, keyCredentials:kc, owners});
    if(last !== null){
      const d = iso(Math.min(last, age));
      signins.push({appId, lastSignInActivity:{lastSignInDateTime:d}, [rnd() < .5 ? "applicationAuthenticationClientSignInActivity" : "delegatedClientSignInActivity"]:{lastSignInDateTime:d}});
      [...pw, ...kc].forEach(c => { if(rnd() < .6) creds.push({keyId:c.keyId, appId, signInActivity:{lastSignInDateTime:d}}); });
    }
  });
  return {apps, signins, creds, signOk:true, credOk:true, signErr:"", credErr:"", scannedAt:new Date().toISOString(), demo:true};
}
$("#demoBtn").onclick = () => { readCfg(); S.raw = demoData(); evaluate(); renderAll(); go("overview"); };

/* ---------------- wiring ---------------- */
$("#signInBtn").onclick = async () => { readCfg(); const tk = SS.get("tok"); if(tk && tk.clientId === S.cfg.clientId && tk.tenant === S.cfg.tenant && await token()) scan(); else signIn(); };
$("#reloadBtn").onclick = () => { readCfg(); scan(); };
$("#outBtn").onclick = () => { if(S.raw?.demo && !SS.get("tok")){ S.raw = null; S.apps = []; renderAll(); go("connect"); } else signOut(); };
$("#copyRedir").onclick = () => copy(REDIRECT);
["#fInactive", "#fSoon"].forEach(id => $(id).onchange = () => { readCfg(); if(S.raw){ evaluate(); renderAll(); } });

function renderAll(){
  applyI18n(); renderConnect();
  $$("nav.side a.needdata").forEach(a => a.classList.toggle("off", !S.raw));
  if(S.raw){
    renderOverview(); syncFilterUI(); renderApps(); renderCleanup();
    const notes = [];
    if(S.raw.demo) notes.push(t("demoOn"));
    if(!S.raw.signOk) notes.push(t("errSignNA", S.raw.signErr));
    else if(!S.raw.credOk) notes.push(t("errCredNA", S.raw.credErr));
    if(notes.length) banner(notes.join(" "), S.raw.signOk ? "info" : "err",
      S.raw.demo ? `<button class="btn" type="button" onclick="document.getElementById('outBtn').click()">${esc(t("demoExit"))}</button>` : "");
    else if($("#banner").classList.contains("info")) banner("");
  } else { $("#cleanBadge").hidden = true; }
}

(async function init(){
  applyTheme();
  S.f.flag = "";
  renderAll();
  try{
    if(await handleRedirect()){ renderAll(); go("connect"); await scan(); return; }
  }catch(e){ banner(t("errAuth", e.message), "err"); }
  const h = location.hash.slice(1);
  go(["overview", "apps", "cleanup", "connect", "about"].includes(h) ? h : "connect");
})();
</script>
</body>
